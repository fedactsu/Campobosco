{% extends 'estructura/base.html' %}
{% block content %}
<div class="container my-3">
    <h1 class="text-center titulo-elegante">Selecciona el Día:</h1>
    <div class="list-group mt-4">
        {% for dias in dia %}
        <a href="{{ dias[1] }}" class="list-group-item-action text-center tarjeta-dia">
            <span class="texto-dia">
                {{ dias[0]|capitalize }}
            </span>
        </a>
        {% endfor %}
    </div>
</div>

{% endblock %}
